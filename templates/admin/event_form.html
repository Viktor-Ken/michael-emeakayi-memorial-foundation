{% extends "admin/base.html" %}
{% block title %}Event — Admin{% endblock %}
{% block admin_content %}
<div class="admin-header">
    <h1>{{ 'Edit event' if mode == 'edit' else 'Add event' }}</h1>
    <a class="btn btn-small" href="{{ url_for('admin_events') }}">Back to events</a>
</div>

<form class="form form-narrow" method="post">
    <div class="form-field">
        <label for="title">Event title</label>
        <input type="text" id="title" name="title" value="{{ event.title if event else '' }}" required>
    </div>
    <div class="form-field">
        <label for="date">Date (YYYY-MM-DD)</label>
        <input type="date" id="date" name="date" value="{{ event.date if event else '' }}" required>
    </div>
    <div class="form-field">
        <label for="location">Location / venue</label>
        <input type="text" id="location" name="location" value="{{ event.location if event else '' }}">
    </div>
    <div class="form-field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5">{{ event.description if event else '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Save changes' if mode == 'edit' else 'Add event' }}</button>
</form>
{% endblock %}
